function adjustParameter(param,direction){
  if(state.animating||state.status==="success")return;

  let bounds;
  if(currentStage().type==="doubleDirect"){
    bounds=current().bounds[stage4CurrentMode()][param];
  }else{
    bounds=current().bounds[param];
  }

  // 모든 단계 공통:
  // 이차항의 계수(a, a1, a2)는 0.5 간격,
  // 나머지 값은 모두 1 간격으로만 움직입니다.
  const isQuadraticCoefficient=/^a\d*$/.test(param);
  const step=isQuadraticCoefficient?.5:1;
  const currentValue=Number(state.params[param]);
  const snappedCurrent=isQuadraticCoefficient
    ?Math.round(currentValue*2)/2
    :Math.round(currentValue);
  const next=snappedCurrent+direction*step;
  const clamped=Math.max(bounds[0],Math.min(bounds[1],next));

  state.params[param]=isQuadraticCoefficient
    ?Math.round(clamped*2)/2
    :Math.round(clamped);
  state.hasEquationInput=true;
  state.collected=currentStage().type==="coins"
    ?current().coinX.map(()=>false)
    :["double","doubleDirect"].includes(currentStage().type)
      ?current().items.map(()=>false)
      :[];
  state.trail=[];
  state.dog=initialDog();
  saveCurrentAnswer();
  playSound("click");
  updateUI();
}

function coinMatches(index){
  const x=current().coinX[index];
  return Math.abs(f(x)-targetY(x))<.25;
}

function runStage1(token){
  state.collected=current().coinX.map(()=>false);
  const [curveStart,curveEnd]=stage1Range();
  const groundStart=1;
  const groundEnd=13.2;
  const duration=3900;
  const begin=performance.now();
  let previousX=curveStart;

  function frame(now){
    if(token!==state.runToken)return;

    const t=Math.min(1,(now-begin)/duration);
    let x,y,rotation=0;
    const phase=t*34;

    if(t<.2){
      const u=t/.2;
      x=groundStart+(curveStart-groundStart)*u;
      y=0;
    }else if(t<.86){
      const u=(t-.2)/.66;
      const eased=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      x=curveStart+(curveEnd-curveStart)*eased;
      y=Math.max(0,f(x));
      rotation=Math.atan(-(2*state.params.a*(x-state.params.p)))*.13;

      state.trail.push({x,y});
      if(state.trail.length>170)state.trail.shift();

      current().coinX.forEach((coinX,index)=>{
        if(state.collected[index]||!coinMatches(index))return;
        const crossed=previousX<=coinX&&x>=coinX;
        if(crossed||Math.abs(x-coinX)<.14){
          state.collected[index]=true;
          playSound("coin");
        }
      });
      previousX=x;
    }else{
      const u=(t-.86)/.14;
      x=curveEnd+(groundEnd-curveEnd)*u;
      y=0;
    }

    state.dog={x,y,rotation,phase};
    drawScene();

    if(t<1)requestAnimationFrame(frame);
    else finishStage1();
  }

  requestAnimationFrame(frame);
}

function stage2Collision(x,y){
  const [lavaStart,lavaEnd]=current().lava;

  if(y<0||y>=12)return true;
  if(x>lavaStart&&x<lavaEnd&&y<=1.25)return true;
  return false;
}

function evaluateStage2Path(){
  const challenge=current();
  const {a,p,q}=state.params;
  const platformY=challenge.landingY;
  const [lavaStart,lavaEnd]=challenge.lava;
  const edgeTolerance=.12;

  const result={
    startOK:false,
    endOK:false,
    crashed:false,
    success:false,
    reason:"landing",
    startX:challenge.startX,
    endX:challenge.endX
  };

  if(a>=0){
    result.reason="direction";
    return result;
  }

  // 포물선과 발판 윗면 y=landingY의 실제 교점을 구한다.
  // 고정된 startX/endX의 함수값을 비교하면, 그림상 발판에 정확히
  // 닿아도 오답이 되는 문제가 생기므로 실제 두 교점으로 판정한다.
  const radiusSquared=(platformY-q)/a;
  if(radiusSquared<0){
    result.reason="height";
    return result;
  }

  const radius=Math.sqrt(radiusSquared);
  const leftIntersection=p-radius;
  const rightIntersection=p+radius;

  result.startX=leftIntersection;
  result.endX=rightIntersection;
  result.startOK=
    leftIntersection>=0-edgeTolerance &&
    leftIntersection<=lavaStart+edgeTolerance;
  result.endOK=
    rightIntersection>=lavaEnd-edgeTolerance &&
    rightIntersection<=currentStage().plot.xMax+edgeTolerance;

  if(!result.startOK){
    result.reason="start";
    return result;
  }

  if(!result.endOK){
    result.reason="end";
    return result;
  }

  // 실제 출발 교점부터 도착 교점까지 전 구간을 검사한다.
  for(let i=0;i<=300;i++){
    const x=leftIntersection+
      (rightIntersection-leftIntersection)*i/300;
    const y=f(x);

    if(stage2Collision(x,y)){
      result.crashed=true;
      result.reason="collision";
      return result;
    }
  }

  result.success=true;
  result.reason="success";
  return result;
}

function runStage2(token){
  const challenge=current();
  const result=evaluateStage2Path();
  const startX=result.startX;
  const endX=result.endX;
  const landingY=challenge.landingY;
  const dogStartX=challenge.dogStartX??1;
  const dogEndX=challenge.dogEndX??19;
  const duration=4300;
  const begin=performance.now();

  function frame(now){
    if(token!==state.runToken)return;

    const t=Math.min(1,(now-begin)/duration);
    let x,y,rotation=0;
    const phase=t*40;

    if(t<.18){
      const u=t/.18;
      x=dogStartX+(startX-dogStartX)*u;
      y=landingY;
    }else if(!result.startOK){
      x=startX;
      y=landingY;
    }else if(t<.82){
      const u=(t-.18)/.64;
      const eased=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      x=startX+(endX-startX)*eased;
      y=f(x);
      const slope=2*state.params.a*(x-state.params.p);
      rotation=Math.atan(-slope)*.12;

      state.trail.push({x,y});
      if(state.trail.length>180)state.trail.shift();
    }else if(result.success){
      const u=(t-.82)/.18;
      x=endX+(dogEndX-endX)*u;
      y=landingY;
    }else{
      const u=(t-.82)/.18;
      x=endX;
      y=Math.max(0,f(endX)-8*u*u);
      rotation=.18*u;
    }

    state.dog={x,y,rotation,phase};
    drawScene();

    if(!result.startOK&&t>=.34){
      finishStage2(result);
      return;
    }

    if(t<1){
      requestAnimationFrame(frame);
    }else{
      finishStage2(result);
    }
  }

  requestAnimationFrame(frame);
}


function evaluateStage3Path(){
  const p=state.params;
  const result={success:false,reason:"items"};

  if(p.a1>=0||p.a2>=0){
    result.reason="direction";
    return result;
  }
  if(p.r1>=p.s1||p.r2>=p.s2){
    result.reason="order";
    return result;
  }
  if(Math.abs(p.s1-p.r2)>.12){
    result.reason="connection";
    return result;
  }
  if(p.r1<0||p.s2>currentStage().plot.xMax){
    result.reason="range";
    return result;
  }

  for(let curve=1;curve<=2;curve++){
    const left=curve===1?p.r1:p.r2;
    const right=curve===1?p.s1:p.s2;
    for(let i=0;i<=180;i++){
      const x=left+(right-left)*i/180;
      const y=doubleF(curve,x);
      if(y<-.05||y>currentStage().plot.yMax-.25){
        result.reason="height";
        return result;
      }
    }
  }

  if(!current().items.every((_,index)=>stage3ItemMatches(index))){
    result.reason="items";
    return result;
  }

  result.success=true;
  result.reason="success";
  return result;
}

function runStage3(token){
  state.collected=current().items.map(()=>false);
  const result=evaluateStage3Path();
  const p=state.params;
  const duration=5000;
  const begin=performance.now();
  let previousX=1;

  function collectItems(x,curve){
    current().items.forEach((item,index)=>{
      if(state.collected[index]||!stage3ItemMatches(index))return;
      const sharedRoot=Math.abs(item.x-p.s1)<.15&&Math.abs(p.s1-p.r2)<.15;
      if(item.curve!==curve&&!sharedRoot)return;
      if((previousX<=item.x&&x>=item.x)||Math.abs(x-item.x)<.13){
        state.collected[index]=true;
        playSound(item.type==="star"?"success":"coin");
      }
    });
    previousX=x;
  }

  function frame(now){
    if(token!==state.runToken)return;

    const t=Math.min(1,(now-begin)/duration);
    let x=1,y=0,rotation=0;
    const phase=t*46;

    if(t<.14){
      const u=t/.14;
      x=1+(p.r1-1)*u;
      y=0;
      previousX=x;
    }else if(t<.48){
      const u=(t-.14)/.34;
      x=p.r1+(p.s1-p.r1)*u;
      y=Math.max(0,doubleF(1,x));
      const slope=p.a1*(2*x-p.r1-p.s1);
      rotation=Math.atan(-slope)*.12;
      collectItems(x,1);
      state.trail.push({x,y,segment:1});
    }else if(Math.abs(p.s1-p.r2)>.12){
      x=p.s1;
      y=0;
    }else if(t<.82){
      const u=(t-.48)/.34;
      x=p.r2+(p.s2-p.r2)*u;
      y=Math.max(0,doubleF(2,x));
      const slope=p.a2*(2*x-p.r2-p.s2);
      rotation=Math.atan(-slope)*.12;
      collectItems(x,2);
      state.trail.push({x,y,segment:2});
    }else{
      const u=(t-.82)/.18;
      x=p.s2+(currentStage().plot.xMax-.7-p.s2)*u;
      y=0;
    }

    if(state.trail.length>230)state.trail.shift();
    state.dog={x,y,rotation,phase};
    drawScene();

    if(Math.abs(p.s1-p.r2)>.12&&t>=.58){
      finishStage3(result);
      return;
    }

    if(t<1)requestAnimationFrame(frame);
    else finishStage3(result);
  }

  requestAnimationFrame(frame);
}


function evaluateStage5Path(){
  const result={success:false,reason:"items"};
  const roots1=stage4Roots(1);
  const roots2=stage4Roots(2);

  // 5단계는 a>0인 아래로 볼록한 포물선입니다.
  if(state.params.a1<=0||state.params.a2<=0){
    result.reason="direction";
    return result;
  }
  if(!roots1||!roots2){
    result.reason="roots";
    return result;
  }
  if(roots1[0]>=roots1[1]||roots2[0]>=roots2[1]){
    result.reason="order";
    return result;
  }
  if(Math.abs(roots1[1]-roots2[0])>.12){
    result.reason="connection";
    return result;
  }
  if(roots1[0]<plot().xMin||roots2[1]>plot().xMax){
    result.reason="range";
    return result;
  }

  for(let curve=1;curve<=2;curve++){
    const roots=curve===1?roots1:roots2;
    for(let i=0;i<=180;i++){
      const x=roots[0]+(roots[1]-roots[0])*i/180;
      const y=stage4F(curve,x);
      if(y<plot().yMin-.05||y>plot().yMax+.05){
        result.reason="height";
        return result;
      }
    }
  }

  if(!current().items.every((_,index)=>stage4ItemMatches(index))){
    result.reason="items";
    return result;
  }

  result.success=true;
  result.reason="success";
  return result;
}


function evaluateStage6Path(){
  const challenge=current();
  const result={success:false,reason:"items"};
  const tolerance=.35;

  // 두 점프 모두 위로 볼록한 포물선(a<0)을 사용합니다.
  if(state.params.a1>=0||state.params.a2>=0){
    result.reason="direction";
    return result;
  }

  if(Math.abs(stage4F(1,challenge.jumpStartX)-challenge.dogStartY)>tolerance){
    result.reason="start";
    return result;
  }
  if(Math.abs(stage4F(1,challenge.landing1.x)-challenge.landing1.y)>tolerance){
    result.reason="landing1";
    return result;
  }
  if(Math.abs(stage4F(2,challenge.jump2StartX)-challenge.landing1.y)>tolerance){
    result.reason="takeoff2";
    return result;
  }
  if(Math.abs(stage4F(2,challenge.landing2.x)-challenge.landing2.y)>tolerance){
    result.reason="landing2";
    return result;
  }

  const segments=[
    {curve:1,from:challenge.jumpStartX,to:challenge.landing1.x},
    {curve:2,from:challenge.jump2StartX,to:challenge.landing2.x}
  ];
  for(const segment of segments){
    for(let i=0;i<=240;i++){
      const x=segment.from+(segment.to-segment.from)*i/240;
      const y=stage4F(segment.curve,x);
      if(y<plot().yMin+.05||y>plot().yMax-.05){
        result.reason="height";
        return result;
      }
      if(stage6PathBlocked(x,y)){
        result.reason="collision";
        return result;
      }
    }
  }

  if(!challenge.items.every((_,index)=>stage4ItemMatches(index))){
    result.reason="items";
    return result;
  }

  result.success=true;
  result.reason="success";
  return result;
}

function runStage6(token){
  state.collected=current().items.map(()=>false);
  const result=evaluateStage6Path();
  const challenge=current();
  const duration=6200;
  const begin=performance.now();
  let previousX=challenge.dogStartX;

  function collectItems(x,curve){
    current().items.forEach((item,index)=>{
      if(state.collected[index]||item.curve!==curve||!stage4ItemMatches(index))return;
      if((previousX<=item.x&&x>=item.x)||Math.abs(x-item.x)<.16){
        state.collected[index]=true;
        playSound(item.type==="star"?"success":"coin");
      }
    });
    previousX=x;
  }

  function curveRotation(curve,x){
    if(state.stage4Mode==="factor"){
      const a=state.params[stage4ValueKey(curve,"a")];
      const r=state.params[stage4ValueKey(curve,"r")];
      const s=state.params[stage4ValueKey(curve,"s")];
      return Math.atan(-(a*(2*x-r-s)))*.12;
    }
    const a=state.params[stage4ValueKey(curve,"a")];
    const p=state.params[stage4ValueKey(curve,"p")];
    return Math.atan(-(2*a*(x-p)))*.12;
  }

  function moveOnCurve(curve,fromX,toX,u){
    const x=fromX+(toX-fromX)*u;
    const y=stage4F(curve,x);
    collectItems(x,curve);
    state.trail.push({x,y,segment:curve});
    return{x,y,rotation:curveRotation(curve,x)};
  }

  function frame(now){
    if(token!==state.runToken)return;
    const t=Math.min(1,(now-begin)/duration);
    let x=challenge.dogStartX,y=challenge.dogStartY,rotation=0;
    const phase=t*52;

    if(t<.08){
      const u=t/.08;
      x=challenge.dogStartX+(challenge.jumpStartX-challenge.dogStartX)*u;
      y=challenge.dogStartY;
      previousX=x;
    }else if(t<.36){
      ({x,y,rotation}=moveOnCurve(1,challenge.jumpStartX,challenge.landing1.x,(t-.08)/.28));
    }else if(t<.43){
      // 가운데 벽돌 발판에 정확히 착지해 잠시 멈춥니다.
      x=challenge.landing1.x;
      y=challenge.landing1.y;
      previousX=x;
    }else if(t<.55){
      // 벽돌 발판 위를 달려 두 번째 점프 위치로 이동합니다.
      const u=(t-.43)/.12;
      x=challenge.landing1.x+(challenge.jump2StartX-challenge.landing1.x)*u;
      y=challenge.landing1.y;
      previousX=x;
    }else if(t<.86){
      ({x,y,rotation}=moveOnCurve(2,challenge.jump2StartX,challenge.landing2.x,(t-.55)/.31));
    }else{
      // 오른쪽 벽돌 발판에 착지한 상태로 끝납니다.
      x=challenge.landing2.x;
      y=challenge.landing2.y;
      rotation=0;
    }

    if((t>=.08&&t<.36)||(t>=.55&&t<.86)){
      if(stage6PathBlocked(x,y)){
        y=stage6ObstacleSurfaceY(x)+.04;
        state.dog={x,y,rotation:0,phase};
        drawScene();
        finishStage4({...result,success:false,reason:"collision"});
        return;
      }
    }

    if(state.trail.length>240)state.trail.shift();
    state.dog={x,y,rotation,phase};
    drawScene();
    if(t<1)requestAnimationFrame(frame);
    else finishStage4(result);
  }

  requestAnimationFrame(frame);
}

function runStage5(token){
  state.collected=current().items.map(()=>false);
  const result=evaluateStage5Path();
  const roots1=stage4Roots(1)||[0,0];
  const roots2=stage4Roots(2)||[0,0];
  const duration=5200;
  const begin=performance.now();
  const startPoint={x:current().dogStartX,y:current().dogStartY};
  const endPoint={x:current().dogEndX,y:current().dogEndY};
  let previousX=startPoint.x;

  function collectItems(x,curve){
    current().items.forEach((item,index)=>{
      if(state.collected[index]||!stage4ItemMatches(index))return;
      const sharedRoot=Math.abs(item.x-roots1[1])<.15&&Math.abs(roots1[1]-roots2[0])<.15;
      if(item.curve!==curve&&!sharedRoot)return;
      if((previousX<=item.x&&x>=item.x)||
         (previousX>=item.x&&x<=item.x)||
         Math.abs(x-item.x)<.13){
        state.collected[index]=true;
        playSound(item.type==="star"?"success":"coin");
      }
    });
    previousX=x;
  }

  function frame(now){
    if(token!==state.runToken)return;

    const t=Math.min(1,(now-begin)/duration);
    let x=startPoint.x,y=startPoint.y,rotation=0;
    const phase=t*48;

    if(t<.12){
      const u=t/.12;
      x=startPoint.x+(roots1[0]-startPoint.x)*u;
      y=startPoint.y+(0-startPoint.y)*u;
      previousX=x;
    }else if(t<.46){
      const u=(t-.12)/.34;
      x=roots1[0]+(roots1[1]-roots1[0])*u;
      y=stage4F(1,x);
      if(state.stage4Mode==="factor"){
        rotation=Math.atan(-(state.params.a1*(2*x-state.params.r1-state.params.s1)))*.12;
      }else{
        rotation=Math.atan(-(2*state.params.a1*(x-state.params.p1)))*.12;
      }
      collectItems(x,1);
      state.trail.push({x,y,segment:1});
    }else if(Math.abs(roots1[1]-roots2[0])>.12){
      x=roots1[1];
      y=0;
    }else if(t<.80){
      const u=(t-.46)/.34;
      x=roots2[0]+(roots2[1]-roots2[0])*u;
      y=stage4F(2,x);
      if(state.stage4Mode==="factor"){
        rotation=Math.atan(-(state.params.a2*(2*x-state.params.r2-state.params.s2)))*.12;
      }else{
        rotation=Math.atan(-(2*state.params.a2*(x-state.params.p2)))*.12;
      }
      collectItems(x,2);
      state.trail.push({x,y,segment:2});
    }else{
      const u=(t-.80)/.20;
      x=roots2[1]+(endPoint.x-roots2[1])*u;
      y=(endPoint.y)*u;
    }

    if(isStage6()&&stage6PathBlocked(x,y)){
      y=stage6ObstacleSurfaceY(x)+.04;
      state.dog={x,y,rotation:0,phase};
      drawScene();
      finishStage4({...result,success:false,reason:"collision"});
      return;
    }

    if(state.trail.length>230)state.trail.shift();
    state.dog={x,y,rotation,phase};
    drawScene();

    if(Math.abs(roots1[1]-roots2[0])>.12&&t>=.58){
      finishStage4(result);
      return;
    }

    if(t<1)requestAnimationFrame(frame);
    else finishStage4(result);
  }

  requestAnimationFrame(frame);
}

function evaluateStage4Path(){
  const challenge=current();
  const result={success:false,reason:"items"};
  const startX=challenge.jumpStartX;
  const landing1=challenge.landing1;
  const landing2=challenge.landing2;
  const tolerance=.3;

  if(state.params.a1>=0||state.params.a2>=0){
    result.reason="direction";
    return result;
  }

  // 첫 점프는 바닥에서 시작해야 합니다.
  if(Math.abs(stage4F(1,startX))>tolerance){
    result.reason="start";
    return result;
  }

  // 첫 기둥에서는 첫 포물선의 끝과 두 번째 포물선의 시작이 같은 높이여야 합니다.
  if(Math.abs(stage4F(1,landing1.x)-landing1.y)>tolerance||
     Math.abs(stage4F(2,landing1.x)-landing1.y)>tolerance){
    result.reason="landing1";
    return result;
  }

  // 두 번째 점프는 오른쪽 기둥 위에서 끝나야 합니다.
  if(Math.abs(stage4F(2,landing2.x)-landing2.y)>tolerance){
    result.reason="landing2";
    return result;
  }

  const segments=[
    {curve:1,from:startX,to:landing1.x},
    {curve:2,from:landing1.x,to:landing2.x}
  ];
  for(const segment of segments){
    for(let i=0;i<=220;i++){
      const x=segment.from+(segment.to-segment.from)*i/220;
      const y=stage4F(segment.curve,x);
      if(y<-.05||y>currentStage().plot.yMax-.15){
        result.reason="height";
        return result;
      }
    }
  }

  if(!challenge.items.every((_,index)=>stage4ItemMatches(index))){
    result.reason="items";
    return result;
  }

  result.success=true;
  result.reason="success";
  return result;
}

function runStage4(token){
  state.collected=current().items.map(()=>false);
  const result=evaluateStage4Path();
  const challenge=current();
  const startX=challenge.jumpStartX;
  const landing1=challenge.landing1;
  const landing2=challenge.landing2;
  const dogStartX=challenge.dogStartX??.5;
  const duration=5900;
  const begin=performance.now();
  let previousX=dogStartX;

  function collectItems(x,curve){
    current().items.forEach((item,index)=>{
      if(state.collected[index]||!stage4ItemMatches(index)||item.curve!==curve)return;
      if((previousX<=item.x&&x>=item.x)||Math.abs(x-item.x)<.13){
        state.collected[index]=true;
        playSound(item.type==="star"?"success":"coin");
      }
    });
    previousX=x;
  }

  function curveRotation(curve,x){
    if(state.stage4Mode==="factor"){
      const a=state.params[stage4ValueKey(curve,"a")];
      const r=state.params[stage4ValueKey(curve,"r")];
      const s=state.params[stage4ValueKey(curve,"s")];
      return Math.atan(-(a*(2*x-r-s)))*.12;
    }
    const a=state.params[stage4ValueKey(curve,"a")];
    const p=state.params[stage4ValueKey(curve,"p")];
    return Math.atan(-(2*a*(x-p)))*.12;
  }

  function moveOnCurve(curve,fromX,toX,u){
    const x=fromX+(toX-fromX)*u;
    const y=Math.max(0,stage4F(curve,x));
    collectItems(x,curve);
    state.trail.push({x,y});
    return{x,y,rotation:curveRotation(curve,x)};
  }

  function frame(now){
    if(token!==state.runToken)return;

    const t=Math.min(1,(now-begin)/duration);
    let x=dogStartX,y=0,rotation=0;
    const phase=t*50;

    if(t<.10){
      const u=t/.10;
      x=dogStartX+(startX-dogStartX)*u;
      y=0;
      previousX=x;
    }else if(t<.40){
      ({x,y,rotation}=moveOnCurve(1,startX,landing1.x,(t-.10)/.30));
    }else if(t<.48){
      // 첫 번째 기둥에 정확히 착지하여 잠시 멈춥니다.
      x=landing1.x;
      y=landing1.y;
      rotation=0;
      previousX=x;
    }else if(t<.80){
      ({x,y,rotation}=moveOnCurve(2,landing1.x,landing2.x,(t-.48)/.32));
    }else{
      // 오른쪽 기둥에 착지한 상태로 끝납니다.
      x=landing2.x;
      y=landing2.y;
      rotation=0;
    }

    if(state.trail.length>230)state.trail.shift();
    state.dog={x,y,rotation,phase};
    drawScene();

    if(t<1)requestAnimationFrame(frame);
    else finishStage4(result);
  }

  requestAnimationFrame(frame);
}

function stage7MonsterHitBox(monster){
  return{
    // 실제 괴물 그림의 폭과 높이에 맞춘 판정 범위입니다.
    // 머리, 몸통, 등껍질, 다리를 모두 포함하지만 그림 밖에서 미리 맞지는 않습니다.
    left:monster.x-1.25,
    right:monster.x+1.25,
    bottom:monster.groundY-.28,
    top:monster.groundY+2.9
  };
}

function stage7ContactForMonster(monster,launchX){
  const hitBox=stage7MonsterHitBox(monster);
  const checkStart=Math.max(launchX,hitBox.left);
  const checkEnd=Math.min(plot().xMax,hitBox.right);
  if(checkEnd<=checkStart)return null;

  for(let i=0;i<=400;i++){
    const x=checkStart+(checkEnd-checkStart)*i/400;
    const y=f(x);
    if(y>=hitBox.bottom&&y<=hitBox.top){
      return{x,y};
    }
  }
  return null;
}

function stage7DogTouchesMonster(dogX,dogY,monster){
  if(!monster||Number.isFinite(monster.hitAt))return false;
  const dogFoot=mapPoint(dogX,dogY);
  const base=mapPoint(monster.originX,monster.originY);

  // 화면에 그려진 괴물의 실제 외곽과 거의 같은 크기입니다.
  // 강아지 발 위치가 이 외곽 안으로 들어올 때만 밟은 것으로 처리합니다.
  return dogFoot.x>=base.x-66&&dogFoot.x<=base.x+66&&
         dogFoot.y>=base.y-103&&dogFoot.y<=base.y+10;
}

function stage7SweptDogTouchesMonster(fromX,fromY,toX,toY,monster){
  const steps=18;
  for(let i=0;i<=steps;i++){
    const u=i/steps;
    const x=fromX+(toX-fromX)*u;
    const y=fromY+(toY-fromY)*u;
    if(stage7DogTouchesMonster(x,y,monster))return true;
  }
  return false;
}

function evaluateStage7Path(){
  const monsters=stage7ChallengeMonsters();
  const firstMonster=monsters[0]||{x:12,groundY:-5.2};
  const result={
    success:false,
    reason:"monster",
    launchX:current().dogStartX+1.5,
    contactX:firstMonster.x,
    contactY:firstMonster.groundY+1.7,
    contacts:[],
    failedMonsterIndex:0
  };
  const {a,p,q}=state.params;
  const groundY=current().dogStartY;

  if(a>=0){result.reason="direction";return result;}
  if(q>plot().yMax-.15||q<=groundY){result.reason="height";return result;}

  const radiusSquared=(groundY-q)/a;
  if(radiusSquared<=0){result.reason="start";return result;}
  const radius=Math.sqrt(radiusSquared);
  result.launchX=p-radius;

  const firstX=Math.min(...monsters.map(monster=>monster.x));
  if(result.launchX<plot().xMin-.1||result.launchX>=firstX+1.0){
    result.reason="start";return result;
  }

  monsters.forEach((monster,index)=>{
    const contact=stage7ContactForMonster(monster,result.launchX);
    if(contact)result.contacts.push({...contact,monsterIndex:index});
  });

  if(result.contacts.length!==monsters.length){
    const missingIndex=monsters.findIndex((_,index)=>
      !result.contacts.some(contact=>contact.monsterIndex===index)
    );
    result.failedMonsterIndex=Math.max(0,missingIndex);
    const missing=monsters[result.failedMonsterIndex]||firstMonster;
    result.contactX=missing.x;
    result.contactY=Math.max(plot().yMin,Math.min(plot().yMax,f(missing.x)));
    result.reason="monster";
    return result;
  }

  result.contacts.sort((a,b)=>a.x-b.x);
  const last=result.contacts[result.contacts.length-1];
  result.contactX=last.x;
  result.contactY=last.y;
  result.success=true;
  result.reason="success";
  return result;
}

function stage7MonsterAnimationAt(t,monster){
  if(!Number.isFinite(monster.hitAt)){
    return{...monster,state:"normal",x:monster.originX,y:monster.originY,rotation:0,scale:1,alpha:1};
  }

  const elapsed=t-monster.hitAt;
  if(elapsed<.065){
    const u=Math.max(0,elapsed/.065);
    return{...monster,state:"squash",x:monster.originX,y:monster.originY,scale:1-.2*u,alpha:1};
  }

  const u=Math.min(1,(elapsed-.065)/.26);
  const eased=1-Math.pow(1-u,2);
  return{
    ...monster,
    state:"ball",
    x:monster.originX-(monster.originX+1.3)*eased,
    y:monster.originY+.22*Math.sin(Math.PI*u),
    rotation:-u*Math.PI*9,
    scale:.82,
    alpha:1-u*.72
  };
}

function runStage7(token){
  const result=evaluateStage7Path();
  const challenge=current();
  const monsters=stage7ChallengeMonsters();
  const launchX=Number.isFinite(result.launchX)?result.launchX:challenge.dogStartX+1.5;
  const contacts=(result.contacts||[]).map(contact=>({...contact}));
  const lastContact=contacts[contacts.length-1];
  const pathEndX=result.success&&lastContact?lastContact.x:result.contactX;
  const pathEndY=result.success&&lastContact?lastContact.y:result.contactY;
  const duration=result.success?6200+(monsters.length-1)*850:3500;
  const begin=performance.now();
  let previousDog={x:challenge.dogStartX,y:challenge.dogStartY};

  function frame(now){
    if(token!==state.runToken)return;
    const t=Math.min(1,(now-begin)/duration);
    let x=challenge.dogStartX,y=challenge.dogStartY,rotation=0;
    const phase=t*52;

    if(t<.14){
      const u=t/.14;
      x=challenge.dogStartX+(launchX-challenge.dogStartX)*u;
      y=challenge.dogStartY;
    }else if(t<.72){
      const u=(t-.14)/.58;
      x=launchX+(pathEndX-launchX)*u;
      y=Math.max(plot().yMin,Math.min(plot().yMax,f(x)));
      rotation=Math.atan(-(2*state.params.a*(x-state.params.p)))*.12;

      state.trail.push({x,y});
      if(state.trail.length>220)state.trail.shift();
    }else if(result.success){
      const u=Math.min(1,(t-.72)/.28*1.12);
      x=pathEndX+(challenge.dogEndX-pathEndX)*u;
      // 마지막 괴물을 밟은 위치에서 도착 발판까지 부드럽게 내려옵니다.
      // 기존처럼 곧바로 바닥으로 순간이동하지 않으므로 접촉 장면이 자연스럽습니다.
      y=pathEndY+(challenge.dogEndY-pathEndY)*u+
        1.15*Math.sin(Math.PI*u);
    }else{
      const u=(t-.72)/.28;
      x=pathEndX-1.0*u;
      y=Math.max(challenge.dogEndY,pathEndY-5.8*u*u);
      rotation=.22*u;
    }

    // 미리 계산한 시간에 변신시키지 않고, 강아지의 발이 실제 괴물 그림에 닿은 순간을 찾습니다.
    let justHit=false;
    state.monsters=state.monsters.map(monster=>{
      let next=monster;
      if(!Number.isFinite(monster.hitAt)&&
         stage7SweptDogTouchesMonster(previousDog.x,previousDog.y,x,y,monster)){
        next={...monster,hitAt:t,state:"squash"};
        justHit=true;
        playSound("coin");
      }
      return stage7MonsterAnimationAt(t,next);
    });

    // 밟는 순간 강아지가 살짝 튀어 올라 접촉감이 보이게 합니다.
    state.monsters.forEach(monster=>{
      if(!Number.isFinite(monster.hitAt))return;
      const elapsed=t-monster.hitAt;
      if(elapsed>=0&&elapsed<.04){
        y+=.38*Math.sin(Math.PI*elapsed/.04);
      }
    });

    state.dog={x,y,rotation,phase};
    previousDog={x,y};
    drawScene();
    if(t<1)requestAnimationFrame(frame);
    else finishStage7(result);
  }
  requestAnimationFrame(frame);
}
function finishStage7(result){
  if(!state.animating)return;
  state.runToken++;
  state.animating=false;

  const allActuallyHit=state.monsters.length>0&&state.monsters.every(monster=>Number.isFinite(monster.hitAt));

  if(result.success&&allActuallyHit){
    state.status="success";
    markChallengeComplete();
    playSound("success");
    showToast(`${currentStage().name} 도전 ${currentChallengeIndex()+1} 성공! 괴물 ${stage7ChallengeMonsters().length}마리를 모두 물리쳤습니다!`);
    proceedAfterSuccess();
  }else{
    state.status="ready";
    state.dog=initialDog();
    state.monsters=initialMonsters();
    setParameterButtonsDisabled(false);
    el.run.disabled=false;
    el.run.textContent=runButtonLabel();
    playSound("miss");
    const messages={
      direction:"a를 음수로 바꾸어 위로 볼록한 포물선을 만드세요.",
      height:"꼭짓점이 화면 안에 오도록 q값을 조절하세요.",
      start:"강아지가 왼쪽 발판에서 출발할 수 있도록 식을 조절하세요.",
      monster:"강아지가 화면의 모든 괴물 몸에 실제로 닿도록 a, p, q값을 조절하세요."
    };
    showToast(messages[result.reason]||messages.monster);
    updateUI();
  }
}

      start:"첫 번째 포물선이 바닥의 출발 지점에서 시작하도록 조절하세요.",
      landing1:isStage6()?"첫 번째 포물선이 가운데 벽돌 발판 위에 착지하도록 조절하세요.":"첫 번째 기둥 위에서 첫 포물선이 끝나고 두 번째 포물선이 시작하도록 조절하세요.",
      takeoff2:"가운데 벽돌 발판 위에서 두 번째 포물선이 시작하도록 조절하세요.",
      landing2:isStage6()?"두 번째 포물선이 오른쪽 벽돌 발판 위에 착지하도록 조절하세요.":"두 번째 포물선이 오른쪽 기둥 위에서 끝나도록 조절하세요.",
      range:"두 포물선이 좌표평면 안에 들어오도록 조절하세요.",
      height:"포물선의 높이가 화면을 넘지 않도록 조절하세요.",
      collision:"강아지의 몸이 벽돌에 닿지 않도록 포물선을 더 높게 조절하세요.",
      items:isStage6()?"동전과 별을 모두 지나면서 가운데와 오른쪽 벽돌 발판에 착지하도록 조절하세요.":"동전과 별을 모두 지나면서 기둥 위에 착지하도록 조절하세요."
    };
    showToast(messages[result.reason]||messages.items);
    updateUI();
  }
}

function finishStage3(result){
  if(!state.animating)return;

  state.runToken++;
  state.animating=false;
  const allCollected=state.collected.every(Boolean);

  if(result.success&&allCollected){
    state.status="success";
    markChallengeComplete();
    playSound("success");
    showToast(`${currentStage().name} 도전 ${currentChallengeIndex()+1} 성공!`);
    proceedAfterSuccess();
  }else{
    state.status="ready";
    setParameterButtonsDisabled(false);
    el.run.disabled=false;
    el.run.textContent=runButtonLabel();
    playSound("miss");

    const messages={
      direction:"두 포물선은 위로 볼록하게 설정되어 있습니다.",
      order:"각 식에서 첫 번째 근이 두 번째 근보다 작아야 합니다.",
      connection:"첫 번째 포물선의 오른쪽 근과 두 번째 포물선의 왼쪽 근을 같게 맞추세요.",
      range:"두 포물선이 좌표평면 안에서 시작하고 끝나도록 조절하세요.",
      height:"포물선이 화면 위를 벗어나지 않도록 폭을 조절하세요.",
      items:"동전과 별의 위치를 모두 지나도록 두 식을 조절하세요."
    };
    showToast(messages[result.reason]||messages.items);
    updateUI();
  }
}

function runDog(){
  if(state.animating||state.status==="success")return;
  if(!state.hasEquationInput){
    showToast("먼저 함수식의 값을 조절해 주세요.");
    return;
  }

  clearTimeout(state.transitionTimer);
  state.runToken++;
  const token=state.runToken;

  state.animating=true;
  state.status="running";
  state.trail=[];
  setParameterButtonsDisabled(true);
  el.run.disabled=true;
  el.resetProblem.disabled=true;
  el.run.textContent=isStage7()?"공격 중...":"달리는 중...";
  playSound("launch");

  if(currentStage().type==="coins")runStage1(token);
  else if(isStage7())runStage7(token);
  else if(currentStage().type==="lava")runStage2(token);
  else if(currentStage().type==="double")runStage3(token);
  else if(isStage6())runStage6(token);
  else if(isStage5())runStage5(token);
  else runStage4(token);
}

function markChallengeComplete(){
  const challengeIndex=currentChallengeIndex();
  state.completedChallenges[state.stage][challengeIndex]=true;
  saveCurrentAnswer();
}

function proceedAfterSuccess(){
  const challengeIndex=currentChallengeIndex();

  if(challengeIndex<currentStage().challenges.length-1){
    state.transitionTimer=setTimeout(()=>{
      saveCurrentAnswer();
      state.challengeByStage[state.stage]=challengeIndex+1;
      loadCurrent();
    },850);
    return;
  }

  state.status="ready";
  setParameterButtonsDisabled(false);
  el.run.disabled=false;
  el.run.textContent=runButtonLabel();

  if(allStagesCompleted()){
    showToast("모든 단계를 완료했습니다!");
  }else{
    showToast(`${currentStage().name} 완료! 다른 단계도 완료해 보세요.`);
  }
  updateUI();
}

function finishStage1(){
  state.animating=false;

  if(exactAnswer()){
    state.collected=current().coinX.map(()=>true);
  }

  const gained=state.collected.filter(Boolean).length;
  const total=current().coinX.length;

  if(gained===total){
    state.status="success";
    markChallengeComplete();
    playSound("success");
    showToast(`${currentStage().name} 도전 ${currentChallengeIndex()+1} 성공!`);
    proceedAfterSuccess();
  }else{
    state.status="ready";
    setParameterButtonsDisabled(false);
    el.run.disabled=false;
    el.run.textContent=runButtonLabel();
    playSound("miss");
    showToast("동전 위치에 맞게 함수식을 다시 조절하세요.");
    updateUI();
  }
}

function finishStage2(result){
  if(!state.animating)return;

  state.runToken++;
  state.animating=false;

  if(result.success){
    state.status="success";
    markChallengeComplete();
    playSound("success");
    showToast(`${currentStage().name} 도전 ${currentChallengeIndex()+1} 성공!`);
    proceedAfterSuccess();
  }else{
    state.status="ready";
    setParameterButtonsDisabled(false);
    el.run.disabled=false;
    el.run.textContent=runButtonLabel();
    playSound("miss");

    const messages={
      direction:"a를 음수로 바꾸어 위로 볼록한 포물선을 만드세요.",
      height:"포물선이 발판 높이와 만나도록 꼭짓점의 높이를 조절하세요.",
      start:"포물선의 왼쪽 교점이 출발 발판 위에 오도록 조절하세요.",
      collision:"천장에 부딪히거나 용암에 빠졌습니다.",
      end:"포물선의 오른쪽 교점이 도착 발판 위에 오도록 조절하세요.",
      landing:"오른쪽 발판에 착지하도록 함수식을 다시 조절하세요."
    };

    showToast(messages[result.reason]||messages.landing);
    updateUI();
  }
}

function showToast(message){
  clearTimeout(toastTimer);
  el.toast.textContent=message;
  el.toast.classList.add("show");
  toastTimer=setTimeout(()=>el.toast.classList.remove("show"),2200);
}

function playSound(type){
  if(state.muted)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const oscillator=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    const now=audioCtx.currentTime;
    const sounds={
      click:[440,.05,"sine"],
      launch:[250,.18,"sawtooth"],
      coin:[900,.08,"sine"],
      success:[650,.34,"triangle"],
      miss:[190,.15,"sine"]
    };
    const [frequency,duration,wave]=sounds[type]||sounds.click;

    oscillator.type=wave;
    oscillator.frequency.setValueAtTime(frequency,now);
    if(type==="success"){
      oscillator.frequency.exponentialRampToValueAtTime(1100,now+duration);
    }

    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.11,now+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
    oscillator.start(now);
    oscillator.stop(now+duration+.02);
  }catch(error){}
}

document.addEventListener("click",event=>{
  const button=event.target.closest("[data-param]");
  if(!button)return;
  adjustParameter(button.dataset.param,Number(button.dataset.dir));
});

el.prevStage.addEventListener("click",()=>selectStage(state.stage-1));
el.nextStage.addEventListener("click",()=>selectStage(state.stage+1));
el.run.addEventListener("click",runDog);
el.prevProblem.addEventListener("click",()=>selectProblem(currentChallengeIndex()-1));
el.resetProblem.addEventListener("click",resetCurrentProblem);
el.nextProblem.addEventListener("click",()=>selectProblem(currentChallengeIndex()+1));
el.modeFactorBtn.addEventListener("click",()=>switchStage4Mode("factor"));
el.modeVertexBtn.addEventListener("click",()=>switchStage4Mode("vertex"));
el.sound.addEventListener("click",()=>{
  state.muted=!state.muted;
  el.sound.textContent=state.muted?"🔇":"🔊";
  if(!state.muted)playSound("click");
});
window.addEventListener("resize",()=>{
  drawScene();
  fitEquationEditors();
});

restoreProblemProgress();
loadCurrent();
})();
</script>
