    }

    function makeCompositeCanvas() {
      // 태블릿 가로 화면에서 좌표평면은 왼쪽, 함수식과 소감은 오른쪽에 표시합니다.
      const graphSize = 900;
      const headerHeight = 108;
      const formulaPanelWidth = 680;
      const canvas = document.createElement("canvas");
      canvas.width = graphSize + formulaPanelWidth;
      canvas.height = headerHeight + graphSize;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 제목과 학번·이름은 충분한 줄 간격으로 분리합니다.
      ctx.fillStyle = "#172033";
      ctx.font = "700 31px Noto Sans KR, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(state.title || "함수 작품", 24, 42);
      ctx.font = "500 16px Noto Sans KR, sans-serif";
      ctx.fillStyle = "#475467";
      const meta = state.studentInfo ? `${state.studentInfo}` : "";
      ctx.fillText(meta, 24, 82);
      ctx.strokeStyle = "#d6dde8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, headerHeight - 1);
      ctx.lineTo(canvas.width, headerHeight - 1);
      ctx.stroke();

      // 왼쪽 좌표평면과 작품
      drawGridToContext(ctx, graphSize, headerHeight);
      ctx.drawImage(refs.fillCanvas, 0, headerHeight, graphSize, graphSize);
      renderFunctionsToContext(ctx, false, graphSize, headerHeight);
      ctx.drawImage(refs.penCanvas, 0, headerHeight, graphSize, graphSize);

      // 오른쪽 함수식·소감 영역
      const panelX = graphSize;
      const panelTop = headerHeight;
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(panelX, panelTop, formulaPanelWidth, graphSize);
      ctx.strokeStyle = "#d6dde8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(panelX, panelTop);
      ctx.lineTo(panelX, canvas.height);
      ctx.stroke();

      ctx.fillStyle = "#172033";
      ctx.font = "700 22px Noto Sans KR, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("사용한 함수와 끝점", panelX + 28, panelTop + 38);

      const reflectionText = String(state.reflection || "").trim();
      const reflectionHeight = reflectionText ? 190 : 0;
      const functionCount = state.functions.length;
      const listTop = panelTop + 72;
      const listBottom = panelTop + graphSize - reflectionHeight - 24;

      if (functionCount === 0) {
        ctx.fillStyle = "#667085";
        ctx.font = "500 17px Noto Sans KR, sans-serif";
        ctx.fillText("사용한 함수가 없습니다.", panelX + 28, panelTop + 82);
      } else {
        const maxRowsPerColumn = 20;
        const columnCount = Math.max(1, Math.min(3, Math.ceil(functionCount / maxRowsPerColumn)));
        const rowCount = Math.ceil(functionCount / columnCount);
        const sidePadding = 28;
        const columnGap = 14;
        const usableHeight = Math.max(80, listBottom - listTop);
        const rowHeight = Math.max(32, Math.min(54, Math.floor(usableHeight / Math.max(1, rowCount))));
        const columnWidth = (formulaPanelWidth - sidePadding * 2 - columnGap * (columnCount - 1)) / columnCount;
        const formulaFontSize = rowHeight >= 48 ? 14 : (rowHeight >= 40 ? 12 : 10);
        const endpointFontSize = Math.max(8, formulaFontSize - 2);
        const circleRadius = rowHeight >= 42 ? 10 : 8;

        state.functions.forEach((fn, index) => {
          const column = Math.floor(index / rowCount);
          const row = index % rowCount;
          const x = panelX + sidePadding + column * (columnWidth + columnGap);
          const centerY = listTop + row * rowHeight + rowHeight / 2;
          if (centerY > listBottom) return;

          ctx.beginPath();
          ctx.arc(x + circleRadius, centerY, circleRadius, 0, Math.PI * 2);
          ctx.fillStyle = fn.color;
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.font = `700 ${Math.max(8, formulaFontSize - 2)}px Arial`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(index + 1), x + circleRadius, centerY + 0.5);

          const textX = x + circleRadius * 2 + 8;
          const textWidth = columnWidth - circleRadius * 2 - 11;
          ctx.save();
          ctx.beginPath();
          ctx.rect(textX, centerY - rowHeight / 2, textWidth, rowHeight);
          ctx.clip();
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";

          drawFormulaOnCanvas(ctx, fn, textX, centerY - rowHeight * 0.16, formulaFontSize, "#172033");

          ctx.fillStyle = "#667085";
          ctx.font = `500 ${endpointFontSize}px Noto Sans KR, sans-serif`;
          ctx.fillText(savedEndpointText(fn), textX, centerY + rowHeight * 0.23);
          ctx.restore();
        });
      }

      if (reflectionText) {
        const reflectionTop = panelTop + graphSize - reflectionHeight;
        ctx.strokeStyle = "#d6dde8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(panelX + 28, reflectionTop);
        ctx.lineTo(panelX + formulaPanelWidth - 28, reflectionTop);
        ctx.stroke();

        ctx.fillStyle = "#172033";
        ctx.font = "700 20px Noto Sans KR, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillText("소감", panelX + 28, reflectionTop + 36);

        ctx.fillStyle = "#475467";
        ctx.font = "500 15px Noto Sans KR, sans-serif";
        const lines = wrapCanvasText(ctx, reflectionText, formulaPanelWidth - 56, 6);
        lines.forEach((line, index) => {
          ctx.fillText(line, panelX + 28, reflectionTop + 68 + index * 23);
        });
      }

      return canvas;
    }

    function downloadCanvas(canvas, filename) {
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = filename;
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function loadSavedWorks() {
      try { return JSON.parse(localStorage.getItem(COMPLETED_KEY) || "[]"); } catch (error) { return []; }
    }
    function saveSavedWorks(list) {
      const compactList = list.slice(0, MAX_SAVED).map(item => {
        const { preview, ...rest } = item || {};
        return rest;
      });
      localStorage.setItem(COMPLETED_KEY, JSON.stringify(compactList));
    }
    function openSavedList() {
      const list = loadSavedWorks();
      if (!list.length) { refs.savedList.innerHTML = '<div class="saved-item"><div class="saved-meta"><h3>저장된 작품이 없습니다.</h3><p>작품 저장(PNG)을 누르면 이곳에 저장됩니다.</p></div></div>'; }
      else {
        refs.savedList.innerHTML = list.map((item, index) => `
          <div class="saved-item">
            <div class="saved-meta">
              <h3>${item.title || '제목 없음'}</h3>
              <p>${item.studentInfo || item.studentNumber || ''} ${item.studentName || ''}</p>
              <p>${item.savedAt || ''}</p>
            </div>
            <div class="saved-actions">
              <button class="btn small soft" type="button" data-load-saved="${index}">불러오기</button>
              <button class="btn small danger" type="button" data-delete-saved="${index}">삭제</button>
            </div>
          </div>
        `).join('');
      }
      refs.savedModal.classList.add("show");
    }

    function updateReflectionCount() {
      const value = refs.reflectionText.value || "";
      refs.reflectionCount.textContent = `${value.length}/500`;
      refs.reflectionBtn.classList.toggle("has-value", Boolean(value.trim()));
    }

    function openReflectionModal() {
      refs.reflectionText.value = state.reflection || "";
      updateReflectionCount();
      refs.reflectionModal.classList.add("show");
      setTimeout(() => refs.reflectionText.focus(), 30);
    }

    function closeReflectionModal() {
      state.reflection = refs.reflectionText.value || "";
      updateReflectionCount();
      refs.reflectionModal.classList.remove("show");
      scheduleSave();
    }

    function saveArtwork(event) {
      event?.preventDefault();
      event?.stopPropagation();
      if (savingArtwork) return;

      const endpointError = firstEndpointError();
      if (endpointError) {
        state.functions.forEach(fn => applyEndpointValidationToRow(fn.id));
        showToast("그래프 위의 점이 되도록 끝점 순서쌍을 확인하세요.");
        return;
      }

      savingArtwork = true;
      refs.saveArtworkBtn.disabled = true;
      try {
        state.fillImage = refs.fillCanvas.toDataURL("image/png");
        state.penImage = refs.penCanvas.toDataURL("image/png");
        const canvas = makeCompositeCanvas();
        const filename = `${(state.title || '함수작품').replace(/\s+/g, '_')}.png`;
        const snapshot = deepCopy(state);
        const savedAt = new Date().toLocaleString('ko-KR');

        try {
          const savedWorks = loadSavedWorks();
          savedWorks.unshift({ title:state.title || '제목 없음', studentInfo:state.studentInfo || '', savedAt, snapshot });
          saveSavedWorks(savedWorks);
        } catch (storageError) {
          console.warn(storageError);
        }

        downloadCanvas(canvas, filename);
        showToast("작품을 PNG로 저장했습니다.");
      } catch (error) {
        console.error(error);
        showToast("저장 중 문제가 발생했습니다. 다시 눌러 주세요.");
      } finally {
        setTimeout(() => {
          savingArtwork = false;
          refs.saveArtworkBtn.disabled = false;
        }, 350);
      }
    }

    refs.functionList.addEventListener("click", event => {
      const row = event.target.closest("[data-row-id]");
      if (row) state.selectedFunctionId = Number(row.dataset.rowId);
      const removeButton = event.target.closest("[data-remove-fn]");
      if (removeButton) {
        const id = Number(removeButton.dataset.removeFn);
        state.functions = state.functions.filter(fn => fn.id !== id);
        if (!state.functions.some(fn => fn.id === state.selectedFunctionId)) state.selectedFunctionId = state.functions[0]?.id ?? null;
        renderAll(); scheduleSave(); return;
      }
      const stepButton = event.target.closest("[data-step-param]");
      if (stepButton) {
        const fnId = Number(stepButton.dataset.fnId);
        const key = stepButton.dataset.stepParam;
        const delta = Number(stepButton.dataset.delta);
        const fn = state.functions.find(item => item.id === fnId);
        if (!fn) return;
        fn.params[key] = round((Number(fn.params[key]) || 0) + delta, 4);
        const input = refs.functionList.querySelector(`[data-fn-id="${fnId}"][data-input-param="${key}"]`);
        if (input) input.value = displayNumber(fn.params[key]);
        applyEndpointValidationToRow(fnId);
        drawFunctionsSvg();
        scheduleSave();
        return;
      }
      if (row) {
        refs.functionList.querySelectorAll(".function-row").forEach(item => item.classList.toggle("active", Number(item.dataset.rowId) === state.selectedFunctionId));
        drawFunctionsSvg();
        scheduleSave();
      }
    });

    refs.functionList.addEventListener("change", event => {
      const typeSelect = event.target.closest("[data-change-type='type']");
      if (typeSelect) {
        const fnId = Number(typeSelect.dataset.fnId);
        updateFunction(fnId, fn => { fn.type = typeSelect.value; resetParamsForType(fn); });
        return;
      }
      const colorInput = event.target.closest("[data-color-input='true']");
      if (colorInput) {
        const fnId = Number(colorInput.dataset.fnId);
        const fn = state.functions.find(item => item.id === fnId);
        if (!fn) return;
        fn.color = colorInput.value;
        const row = refs.functionList.querySelector(`.function-row[data-row-id="${fnId}"]`);
        const badge = row?.querySelector('.badge-circle');
        if (badge) badge.style.background = fn.color;
        drawFunctionsSvg();
        scheduleSave();
        return;
      }
      const endpointInput = event.target.closest("[data-endpoint]");
      if (endpointInput) {
        const fnId = Number(endpointInput.dataset.fnId);
        const [slot, axis] = endpointInput.dataset.endpoint.split("-");
        const fn = state.functions.find(item => item.id === fnId);
        if (!fn) return;
        fn.endpoints[Number(slot)][axis] = endpointInput.value;
        applyEndpointValidationToRow(fnId);
        drawFunctionsSvg();
        scheduleSave();
        return;
      }
      const paramInput = event.target.closest("[data-input-param]");
      if (paramInput) {
        const fnId = Number(paramInput.dataset.fnId);
        const key = paramInput.dataset.inputParam;
        const value = parseMaybe(paramInput.value);
        const fn = state.functions.find(item => item.id === fnId);
        if (!fn) return;
        if (value !== null) fn.params[key] = value;
        applyEndpointValidationToRow(fnId);
        drawFunctionsSvg();
        scheduleSave();
      }
    });

    refs.functionList.addEventListener("input", event => {
      const endpointInput = event.target.closest("[data-endpoint]");
      if (endpointInput) {
        const fnId = Number(endpointInput.dataset.fnId);
        const [slot, axis] = endpointInput.dataset.endpoint.split("-");
        const fn = state.functions.find(item => item.id === fnId);
        if (!fn) return;
        fn.endpoints[Number(slot)][axis] = endpointInput.value;
        applyEndpointValidationToRow(fnId);
        drawFunctionsSvg(); scheduleSave(); return;
      }
      const paramInput = event.target.closest("[data-input-param]");
      if (paramInput) {
        const fnId = Number(paramInput.dataset.fnId);
        const key = paramInput.dataset.inputParam;
        const fn = state.functions.find(item => item.id === fnId);
        if (!fn) return;
        const value = parseMaybe(paramInput.value);
        if (value !== null) fn.params[key] = value;
        applyEndpointValidationToRow(fnId);
        drawFunctionsSvg(); scheduleSave();
      }
    });

    refs.addFunctionBtn.addEventListener("click", () => {
      const fn = makeFunction(state.functions.length, refs.addFunctionType.value);
      state.functions.push(fn);
      state.selectedFunctionId = fn.id;
      renderAll(); scheduleSave();
    });
    [refs.artTitle, refs.studentInfo].forEach(input => input.addEventListener("input", () => {
      state.title = refs.artTitle.value;
      state.studentInfo = refs.studentInfo.value;
      scheduleSave();
    }));
    refs.graphRange.addEventListener("change", () => { state.range = Number(refs.graphRange.value); drawGridSvg(); drawFunctionsSvg(); scheduleSave(); });
    refs.customColor.addEventListener("input", () => { state.selectedColor = refs.customColor.value; renderPalette(); scheduleSave(); });
    refs.brushWidth.addEventListener("input", () => { state.brushWidth = Number(refs.brushWidth.value); refs.brushWidthValue.textContent = String(state.brushWidth); scheduleSave(); });
    refs.undoBtn.addEventListener("click", undoAction);
    refs.redoBtn.addEventListener("click", redoAction);
    refs.zoomOutBtn.addEventListener("click", () => setViewZoom(state.zoom - 0.1));
    refs.zoomInBtn.addEventListener("click", () => setViewZoom(state.zoom + 0.1));
    refs.fitViewBtn.addEventListener("click", resetView);
    document.querySelectorAll(".tool-btn").forEach(btn => btn.addEventListener("click", () => setActiveTool(btn.dataset.tool)));

    document.querySelector(".canvas-stage")?.addEventListener("pointerdown", clearTextSelection, true);
    document.addEventListener("selectionchange", () => {
      const selection = window.getSelection?.();
      if (!selection || selection.isCollapsed) return;
      const anchor = selection.anchorNode?.parentElement;
      if (anchor?.closest?.("#gridSvg, #graphSvg, .canvas-stage")) selection.removeAllRanges();
    });

    refs.interactionLayer.addEventListener("pointerdown", beginDrawing);
    refs.interactionLayer.addEventListener("pointermove", moveDrawing);
    refs.interactionLayer.addEventListener("pointerup", endDrawing);
    refs.interactionLayer.addEventListener("pointerleave", endDrawing);
    refs.interactionLayer.addEventListener("pointercancel", endDrawing);
    refs.interactionLayer.addEventListener("wheel", event => { event.preventDefault(); const factor = event.deltaY < 0 ? 1.12 : 0.89; setViewZoom(state.zoom * factor); }, { passive:false });

    refs.resetBtn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      closeConfirm();
      localStorage.removeItem(DRAFT_KEY);
      LEGACY_DRAFT_KEYS.forEach(key => localStorage.removeItem(key));
      state = defaultState();
      clearCanvas(fillCtx);
      clearCanvas(penCtx);
      undoStack = [];
      redoStack = [];
      renderAll();
      scheduleSave();
      showToast("현재 작업을 초기화했습니다.");
    });
    refs.exampleBtn.addEventListener("click", () => {
      clearTextSelection();
      refs.exampleModal.classList.add("show");
      requestAnimationFrame(() => {
        requestAnimationFrame(fitExampleImage);
      });
      setTimeout(fitExampleImage, 80);
    });
    refs.closeExampleModal.addEventListener("click", () => refs.exampleModal.classList.remove("show"));
    refs.exampleZoomOutBtn.addEventListener("click", () => setExampleZoom(exampleZoom * 0.89));
    refs.exampleZoomInBtn.addEventListener("click", () => setExampleZoom(exampleZoom * 1.12));
    refs.exampleFitBtn.addEventListener("click", fitExampleImage);
    refs.exampleViewport.addEventListener("pointerdown", beginExamplePan);
    refs.exampleViewport.addEventListener("pointermove", moveExamplePan);
    refs.exampleViewport.addEventListener("pointerup", endExamplePan);
    refs.exampleViewport.addEventListener("pointercancel", endExamplePan);
    refs.exampleViewport.addEventListener("pointerleave", endExamplePan);
    refs.exampleViewport.addEventListener("wheel", event => { event.preventDefault(); const factor = event.deltaY < 0 ? 1.12 : 0.89; setExampleZoom(exampleZoom * factor); }, { passive:false });
    refs.exampleImage.addEventListener("load", fitExampleImage);
    window.addEventListener("resize", () => { if (refs.exampleModal.classList.contains("show")) fitExampleImage(); });
    refs.savedListBtn.addEventListener("click", openSavedList);
    refs.closeSavedModal.addEventListener("click", () => refs.savedModal.classList.remove("show"));
    refs.reflectionBtn.addEventListener("click", openReflectionModal);
    refs.closeReflectionModal.addEventListener("click", closeReflectionModal);
    refs.reflectionDoneBtn.addEventListener("click", closeReflectionModal);
    refs.reflectionText.addEventListener("input", () => {
      state.reflection = refs.reflectionText.value || "";
      updateReflectionCount();
      scheduleSave();
    });
    refs.saveArtworkBtn.addEventListener("click", saveArtwork);
    refs.clearColoringBtn.addEventListener("click", clearColoring);
    refs.confirmCancelBtn.addEventListener("click", closeConfirm);
    refs.confirmOkBtn.addEventListener("click", () => {
      const action = pendingConfirmAction;
      refs.confirmModal.classList.remove("show");
      pendingConfirmAction = null;
      if (action) action();
    });

    refs.savedList.addEventListener("click", event => {
      const loadBtn = event.target.closest("[data-load-saved]");
      if (loadBtn) {
        const index = Number(loadBtn.dataset.loadSaved);
        const item = loadSavedWorks()[index];
        if (!item) return;
        state = sanitizeState(item.snapshot);
        Promise.all([restoreLayer(fillCtx, state.fillImage), restoreLayer(penCtx, state.penImage)]).then(() => { undoStack = []; redoStack = []; renderAll(); scheduleSave(); refs.savedModal.classList.remove("show"); showToast("저장한 작품을 불러왔습니다."); });
        return;
      }
      const deleteBtn = event.target.closest("[data-delete-saved]");
      if (deleteBtn) {
        event.preventDefault();
        event.stopPropagation();
        const index = Number(deleteBtn.dataset.deleteSaved);
        const list = loadSavedWorks();
        list.splice(index, 1);
        saveSavedWorks(list);
        openSavedList();
        showToast("저장 작품을 삭제했습니다.");
      }
    });

    window.addEventListener("click", event => {
      if (event.target === refs.savedModal) refs.savedModal.classList.remove("show");
      if (event.target === refs.exampleModal) refs.exampleModal.classList.remove("show");
      if (event.target === refs.reflectionModal) closeReflectionModal();
      if (event.target === refs.confirmModal) closeConfirm();
    });

    function initCanvasImages() {
      return Promise.all([
        restoreLayer(fillCtx, state.fillImage),
        restoreLayer(penCtx, state.penImage)
      ]);
    }

    window.addEventListener("resize", applyViewTransform);

    buildFunctionDogExample();
    renderAll();
    initCanvasImages().then(() => updateHistoryButtons());

    fitBoardToCanvasArea();
    if ("ResizeObserver" in window) {
      const boardResizeObserver = new ResizeObserver(() => fitBoardToCanvasArea());
      boardResizeObserver.observe(refs.canvasStack.parentElement);
    }
    window.addEventListener("resize", fitBoardToCanvasArea);
  </script>
</body>
</html>
